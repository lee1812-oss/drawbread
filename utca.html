<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>UTCA 출력일보</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="utca-ver" content="v004"><meta name="utca-build" content="2026-11-27 v004 한국 검정·미국 파랑(노랑 바탕), 월간 기본">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 2026-11-26 조조: 업무 대시보드 「UTCA 출력일보」 시트를 떼어 낸 단독 화면. 02 컴퓨터 2번(위) 모니터용.
 자료: 사무실 PC가 02 열쇠로 암호화해 올리는 utcak02.enc.json(03 화면 틀·카톡 원문·반영 명단) + utca02.enc.json(주간·월간 다이어리 그림), 10분마다 새로 받음.
 열쇠: 02 PC 실행 파일이 주소 #k= 로 넘김 → 이 PC 전용 크롬 프로필에만 기억, 주소창에서는 바로 지움. 화면 파일에는 열쇠·자료 없음.
 ESC 또는 오른쪽 위 「닫기」 = 창 닫기. 작업 표시줄 UTCA 아이콘으로 다시 엶. -->
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{font:18px/1.35 'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;color:#1a1a1a;background:#e9ecf1;display:flex;flex-direction:column}
/* v002: 머리 한 줄(안쪽 화면 제목 줄은 숨김) · 남색 바탕 · 시계 숫자 크게 */
header{flex:none;display:flex;align-items:center;gap:14px;padding:6px 10px 6px 16px;background:#0D1C42;border-bottom:4px solid #BF913C;white-space:nowrap;min-height:96px}
.brand .co{font-size:15px;font-weight:700;color:#FCF1D0}.brand .co .v{font-size:14px;font-weight:600;color:#c9cfdb}
.brand h1{margin:0;font-size:30px;line-height:1.15;font-weight:800;color:#fff;letter-spacing:-.6px}
/* v003: 한국·미국 칸마다 「나라 이름 + 날짜(요일)」와 시간을 모두 크게. 오전/오후 표시 */
.clk{display:flex;gap:12px;margin-left:6px}
/* v004: 한국 = 검정 글자(흰 바탕), 미국 동부 = 파랑 글자(노랑 바탕, 보색) */
.clk>div{background:#fff;border-radius:12px;padding:6px 18px;display:flex;align-items:center;gap:14px;border:3px solid #fff}
.clk>div.us{background:#FFE500;border-color:#FFE500}
.clk .lb{display:flex;flex-direction:column;line-height:1.05}
.clk .lb em{font-style:normal;font-size:21px;font-weight:800;color:#fff;background:#111;border-radius:6px;padding:2px 9px;align-self:flex-start}
.clk .us .lb em{background:#0038C8}
.clk .lb i{font-style:normal;font-size:34px;font-weight:900;color:#000;letter-spacing:-1px;margin-top:4px;font-variant-numeric:tabular-nums}
.clk .tm{display:flex;align-items:baseline;gap:6px}
.clk .tm small{font-size:22px;font-weight:800;color:#000}
.clk .us .lb i,.clk .us .tm small,.clk .us b{color:#0038C8}
.clk b{font-size:58px;font-weight:900;color:#000;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-1.5px}
#info{font-size:16px;font-weight:700;color:#FCF1D0;line-height:1.4;overflow:hidden;text-overflow:ellipsis;min-width:0}
#info small{display:block;font-size:14px;font-weight:600;color:#c9cfdb}
.sp{flex:1}
#close{height:56px;min-width:170px;padding:0 18px;font:800 21px 'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;border:0;background:#fff;color:#A11B1B;border-radius:10px;cursor:pointer;flex:none}
#close small{font-size:15px;font-weight:700;color:#5b6270;margin-left:6px}
#close:hover{background:#A11B1B;color:#fff}#close:hover small{color:#fff}
#wrap{flex:1;min-height:0;position:relative;padding:6px}
#utf{width:100%;height:100%;border:0;background:#fff;display:none;border-radius:4px}
#msg{position:absolute;inset:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:800;color:#14284B;background:#fff;border:2px solid #1F3A68;border-radius:6px}
#msg small{display:block;font-size:19px;font-weight:600;color:#3d4654;margin-top:8px}
#toast{position:fixed;right:16px;top:90px;background:#A11B1B;color:#fff;font-size:20px;font-weight:800;padding:12px 18px;border-radius:8px;display:none;z-index:9}
@media (max-width:1800px){#info small{display:none}}
@media (max-width:1500px){.clk b{font-size:44px}.clk .lb i{font-size:27px}.clk .lb em{font-size:18px}.brand h1{font-size:24px}#info{display:none}.brand .co{font-size:13px}.brand .co .v{font-size:13px}}
</style></head><body>
<header><div class="brand"><div class="co">(주)유티씨에이솔루션 · 평택 법인<span class="v"> · v004 · 11/27 12:40 업데이트</span></div><h1>UTCA 출력일보 · 공수 현황</h1></div>
<div class="clk"><div class="kr"><span class="lb"><em>한국</em><i id="krD">-</i></span><span class="tm"><small id="krA"></small><b id="krT">--:--</b></span></div><div class="us"><span class="lb"><em>미국 동부</em><i id="usD">-</i></span><span class="tm"><small id="usA"></small><b id="usT">--:--</b></span></div></div>
<div id="info"><span id="at">자료 받는 중</span><small id="binfo"></small></div><span class="sp"></span><button id="close" type="button" title="창 닫기 (ESC)">✕ 닫기<small>ESC</small></button></header>
<div id="wrap"><div id="msg"><div>UTCA 출력일보 자료를 받는 중입니다<small>잠시만 기다려 주세요</small></div></div><iframe id="utf" title="UTCA 출력일보"></iframe></div>
<div id="toast">창 오른쪽 위 X를 눌러 닫아 주세요</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
/* 열쇠: #k= 로 받으면 기억하고 주소에서 지움(기록 줄 늘리지 않음 → ESC 닫기 유지) */
var KEY='';try{var h=location.hash.match(/[#&]k=([^&]+)/);if(h){KEY=decodeURIComponent(h[1]);localStorage.setItem('utca_k',KEY);history.replaceState(null,'',location.pathname+location.search);}else KEY=localStorage.getItem('utca_k')||'';}catch(e){}
if(!KEY){$('msg').innerHTML='<div>이 PC에 UTCA 열쇠가 없습니다<small>작업 표시줄의 UTCA 아이콘으로 열어 주세요</small></div>';}
/* 창 닫기: ESC · 닫기 버튼 */
function closeWin(){try{window.close();}catch(e){}setTimeout(function(){var t=$('toast');t.style.display='block';setTimeout(function(){t.style.display='none'},4000)},400)}
function onKey(e){if(e.key==='Escape'||e.keyCode===27){e.preventDefault();closeWin();}}
document.addEventListener('keydown',onKey,true);$('close').onclick=closeWin;
/* 한국·미국 동부 시계 */
var WD=['일','월','화','수','목','금','토'];
function fmt(tz){var o=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,weekday:'short'}).formatToParts(new Date()),m={};o.forEach(function(p){m[p.type]=p.value});var d=new Date(+m.year,+m.month-1,+m.day),H=(m.hour==='24'?0:+m.hour);return {t:(H<10?'0':'')+H+':'+m.minute,a:H<12?'오전':'오후',d:(+m.month)+'/'+(+m.day)+'('+WD[d.getDay()]+')'}}
function tick(){var k=fmt('Asia/Seoul'),u=fmt('America/New_York');$('krT').textContent=k.t;$('krA').textContent=k.a;$('krD').textContent=k.d;$('usT').textContent=u.t;$('usA').textContent=u.a;$('usD').textContent=u.d}
tick();setInterval(tick,5000);
var UTK=null,UTI=null,S2K='',SHEET=2;
function wireFrame(){try{var w=$('utf').contentWindow;w.document.addEventListener('keydown',onKey,true);}catch(e){}}
$('utf').addEventListener('load',wireFrame);
/* 업무 대시보드 시트(ccpview.html v015 s2build)와 같은 조립 방식 */
function s2build(){if(!UTK||!UTK.tpl){return}var key=UTK.at+'|'+(UTI?UTI.at:'');if(key===S2K)return;S2K=key;
 var t=UTK.tpl,inj='<style>#bar{display:none!important}#main{top:0!important}body{max-width:none!important}</style><script>'+[UTK.kakao,UTK.refl,UTK.local].map(function(x){return String(x||'').replace(/<\/script/gi,'<\\/script')}).join('\n')+'\nwindow.UTIMG='+JSON.stringify(UTI?{w:UTI.weekly,m:UTI.monthly}:null)+';<\/script>';
 t=t.replace(/<head>/i,'<head>'+inj).replace('async function findLatest(){','async function findLatest(){if(window.UTIMG&&(weekly?UTIMG.w:UTIMG.m))return {name:"",d:new Date(),src:weekly?UTIMG.w:UTIMG.m};')
  .replace("img.src=encodeURI(r.name)+'?t='+Date.now();","img.src=r.src||(encodeURI(r.name)+'?t='+Date.now());")
  .replace("location.hash=weekly?'':'weekly';location.reload();","weekly=!weekly;document.getElementById('img').className=weekly?'weekly':'';refresh();")
  .replace("setTimeout(function(){location.reload();},10*60*1000);","");
 var f=$('utf');f.srcdoc=t;f.style.display='block';$('msg').style.display='none'}
function showAt(){try{var s=UTK&&UTK.at;if(!s)return;var d=new Date(s);if(isNaN(d))return;var k=fmt('Asia/Seoul');var p={};new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).forEach(function(x){p[x.type]=x.value});$('at').textContent='자료 '+p.month+'/'+p.day+' '+(p.hour==='24'?'00':p.hour)+':'+p.minute+' 기준';}catch(e){}}
function b(s){var x=atob(s),u=new Uint8Array(x.length);for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
function dec(e,pw){var enc=new TextEncoder();return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.salt),iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},key,b(e.ct))}).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))})}

var UL1='',UL2='';function pullU(){var pw=KEY;if(!pw||!window.crypto||!crypto.subtle)return;var B='https://lee1812-oss.github.io/drawbread/';
 fetch(B+'utcak02.enc.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(e){if(!e||e.updated===UL1)return;return dec(e,pw).then(function(n){UL1=e.updated;if(n&&n.tpl){UTK=n;showAt();s2build()}})}).catch(function(){if(!UTK)$('msg').innerHTML='<div>자료를 풀지 못했습니다<small>열쇠가 바뀌었을 수 있습니다. 조조에게 알려 주세요</small></div>'});
 fetch(B+'utca02.enc.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(e){if(!e||e.updated===UL2)return;return dec(e,pw).then(function(n){UL2=e.updated;if(n&&(n.weekly||n.monthly)){UTI=n;s2build()}})}).catch(function(){})}
pullU();setInterval(function(){if(!document.hidden)pullU()},600000);
/* v002: 안쪽 화면의 다이어리 종류·공수표 판을 머리에 한 줄로 */
setInterval(function(){try{var d=$('utf').contentDocument;if(!d)return;var k=d.getElementById('kind'),s=d.getElementById('src');$('binfo').textContent='오른쪽 다이어리 '+(k?k.textContent:'')+(s&&s.textContent?' · '+s.textContent:'')+' · 다이어리 누르면 주간↔월간(주간은 1분 뒤 월간으로)';}catch(e){}},3000);
/* v002: 화면 파일이 새 판으로 바뀌면 10분 안에 스스로 새로 고침(창은 그대로, ESC 닫기 유지) */
var MYV=(document.querySelector('meta[name="utca-ver"]')||{}).content||'';
setInterval(function(){fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){var m=t.match(/name="utca-ver" content="([^"]+)"/);if(m&&MYV&&m[1]!==MYV)location.replace(location.pathname+'?t='+Date.now());}).catch(function(){})},600000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pullU()});
})();
</script></body></html>
