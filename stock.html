@media(max-width:1100px){#top{grid-template-columns:1fr auto auto}#sum{grid-column:1/-1;grid-row:2;max-width:none}}
@media(max-width:640px){#top{grid-template-columns:1fr;padding:8px 10px;gap:8px}.brand img{width:46px;height:46px}.bm>div{font-size:13px}.bm .co{font-size:13.5px}.bm .ver{font-size:12.5px}.bm h1{font-size:24px}#sum{grid-row:3;grid-template-columns:repeat(3,1fr)}.sortbox{grid-row:4;flex-direction:row;align-items:center;gap:8px}.bm .hint{white-space:normal}.st{min-height:54px}.st b{font-size:24px}.clock{grid-row:2;text-align:left;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}.clock .t{font-size:22px}.clock .s{font-size:13.5px}
 #grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 10px 14px;gap:8px}.card{min-height:132px;padding:8px 9px}.card .nm{font-size:18px}.card .q{font-size:28px}
 #bar{padding:8px 10px 0}#bar .note{margin-left:0;width:100%}.big3 b{font-size:23px}#pn .ph h2{font-size:23px}table.lg{font-size:15px}.hide-m{display:none}}
</style></head><body>
<header id="top">
 <div class="brand"><img src="brand_logo.png" alt="빵을그리다 로고"><div class="bm"><div><span class="co">빵을그리다 주식회사</span><span class="ver" id="ver"></span></div><h1>오늘의 재고 현황</h1><div class="hint">카드를 누르면 입고 · 출고 · 재고 내역</div></div></div>

 <div class="sortbox"><label for="sortSel">보는 순서</label><select id="sortSel"><option value="need">급한 순</option><option value="list">수불부 순서</option><option value="name">가나다순</option></select></div>

<div id="ov"></div>
<aside id="pn" aria-hidden="true"><div class="ph"><div><h2 id="pt"></h2><div class="sub" id="ps"></div></div><button class="x" id="px" aria-label="닫기">✕</button></div><div class="bd" id="pb"></div></aside>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const DEF_F='YQCKYNRdM9aUwBoRco-wVsZbrPqpNrcE_spfdCqlD0w'; /* 업무 대시보드 직원용 공장 화면과 같은 열쇠(대시보드 dash.html에도 들어 있음) */
const LIVE='https://lee1812-oss.github.io/wonryo/data.json'; /* 이카운트 전산 재고, 사무실 PC가 5분마다 갱신 */
const DOW=['일','월','화','수','목','금','토'];
const VER=($('meta[name="stock-ver"]')||{}).content||'',BUILD=($('meta[name="stock-build"]')||{}).content||'';
$('#ver').textContent=VER+' · '+BUILD.slice(5,16).replace('-','/')+' 업데이트';
let D=null,LV=null,LVAT='',SORT='need',FIL='all',OPEN=null,KF='all';
try{SORT=localStorage.getItem('stock4_sort')||'need';}catch(_){}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kst=()=>new Date(Date.now()+(new Date().getTimezoneOffset()+540)*60000);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const t=new Date(s+'T00:00:00');t.setDate(t.getDate()+n);return ymd(t);};
const md=s=>{const t=new Date(s+'T00:00:00');return (t.getMonth()+1)+'/'+t.getDate()+'('+DOW[t.getDay()]+')';};
const fg=v=>Math.round(v).toLocaleString('ko-KR');
function kgTxt(g){const a=Math.abs(g);if(a<10&&Math.round(g)!==g)return {n:String(Math.round(g*10)/10),u:'g'};if(a<1000)return {n:fg(g),u:'g'};const k=g/1000;return {n:(a>=100000?Math.round(k):Math.round(k*10)/10).toLocaleString('ko-KR'),u:'kg'};}
function kgS(g){const x=kgTxt(g);return x.n+x.u;}
async function decrypt(e,pw){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const enc=new TextEncoder();const it=+((e.kdf||'').match(/(\d+)$/)||[0,100000])[1];
 const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.salt),iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},key,b(e.ct))));}
const USE=l=>(l.k==='생산 소모'||l.k==='자가사용')&&!/실사/.test(l.m||'');
function calc(it){
 const today=ymd(kst());const live=LV&&LV[it.code]!=null?LV[it.code]:null;const q=live!=null?live:it.qty;
 const from28=addD(today,-28);let use28=0;for(const l of it.lines)if(l.d>from28&&USE(l))use28+=l.o;
 const daily=use28/28;const days=daily>0?q/daily:null;
 const t=kst();const mon=addD(today,-((t.getDay()+6)%7));let wi=0,wo=0;for(const l of it.lines)if(l.d>=mon){wi+=l.i;wo+=l.o;}
 let st,lab;if(q<0){st='r';lab='확인 필요';}else if(q===0){st='r';lab='재고 없음';}else if(days==null){st='n';lab='사용 없음';}else if(days<7){st='o';lab='부족 주의';}else{st='g';lab='여유';}
 const last=it.lines.length?it.lines[it.lines.length-1].b:it.open;
 return {q,live:live!=null,daily,days,wi,wo,st,lab,diff:live!=null?Math.round((live-last)*10)/10:0};}
const RANK={r:0,o:1,g:2,n:3};
function render(){
 if(!D)return;const rows=D.items.map((it,i)=>({it,i,c:calc(it)}));
 const cnt={all:rows.length,r:0,o:0,g:0,n:0};rows.forEach(x=>cnt[x.c.st]++);
 const T=[['all','전체 품목',cnt.all,''],['r','확인 필요',cnt.r,'r'],['o','부족 주의',cnt.o,'o'],['g','여유',cnt.g,'g'],['n','사용 없음',cnt.n,'n']];
 $('#sum').innerHTML=T.map(x=>'<button class="st '+x[3]+'" data-f="'+x[0]+'" aria-pressed="'+(FIL===x[0])+'"><b class="num">'+x[2]+'</b><span>'+x[1]+'</span></button>').join('');
 let L=rows.filter(x=>FIL==='all'||x.c.st===FIL);
 if(SORT==='need')L.sort((a,b)=>RANK[a.c.st]-RANK[b.c.st]||((a.c.days==null?1e9:a.c.days)-(b.c.days==null?1e9:b.c.days))||a.i-b.i);
 else if(SORT==='name')L.sort((a,b)=>a.it.nm.localeCompare(b.it.nm,'ko'));
 try{$('#sortSel').value=SORT;}catch(_){}
 if(!L.length){$('#grid').innerHTML='<div class="empty">이 구분에 해당하는 품목이 없습니다</div>';return;}
 $('#grid').innerHTML=L.map(({it,c})=>{const q=kgTxt(c.q);
  const d1=c.q<0?'전산 재고 마이너스':c.days==null?'최근 4주 사용 없음':'<b class="num">약 '+(c.days>=100?'100일 이상':Math.floor(c.days)+'일치')+'</b> · 하루 '+kgS(c.daily);
  const pk=it.spec&&c.q/it.spec>=0.1?' <span class="gg pk">포장 '+(Math.round(c.q/it.spec*10)/10)+'개</span>':'';
  return '<button class="card '+c.st+'" data-code="'+esc(it.code)+'" title="'+esc(it.nm)+' · 누르면 입고·출고·재고 내역"><div class="h"><span class="nm">'+esc(it.nm)+'</span><span class="gg">gg'+esc(it.gg)+'</span></div>'+
  '<div class="h"><div class="q num">'+q.n+'<small>'+q.u+'</small></div><span class="lab '+c.st+'">'+c.lab+'</span></div><div class="d1">'+d1+'</div>'+
  '<div class="d2">이번 주 입고 <b class="num">'+(c.wi?kgS(c.wi):'0')+'</b> · 출고 <b class="num">'+(c.wo?kgS(c.wo):'0')+'</b></div></button>';}).join('');
 fit();if(OPEN)detail(OPEN,true);}
/* 한 화면 맞춤(2026-11-25 v003): 남은 높이·폭과 품목 수로 칸 수·카드 크기를 계산 (넓은 화면만, 휴대폰은 아래로 넘김) */
function fit(){const g=$('#grid');const n=g.querySelectorAll('.card').length;g.classList.remove('fit','tight');g.style.gridTemplateColumns='';g.style.gridTemplateRows='';g.style.setProperty('--s','1');
 if(!n||innerWidth<700||innerHeight<420)return;const cs=getComputedStyle(g);const W=g.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);const H=innerHeight-g.getBoundingClientRect().top-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);const gap=8;
 const pick=bh=>{let best=null;for(let c=2;c<=12;c++){const r=Math.ceil(n/c);const cw=(W-(c-1)*gap)/c,ch=(H-(r-1)*gap)/r;if(cw<120||ch<60)continue;const s=Math.min(cw/240,ch/bh);if(!best||s>best.s)best={c,r,ch,s};}return best;};
 let b=pick(127),tight=false;if(b&&b.s<0.8){const b2=pick(104);if(b2&&b2.s>b.s){b=b2;tight=true;}}if(!b)return;
 g.classList.add('fit');g.classList.toggle('tight',tight);g.style.gridTemplateColumns='repeat('+b.c+',minmax(0,1fr))';g.style.gridTemplateRows='repeat('+b.r+','+Math.floor(b.ch)+'px)';g.style.setProperty('--s',String(Math.max(0.55,Math.min(1.6,b.s)).toFixed(3)));}
addEventListener('resize',()=>{clearTimeout(window.__ft);window.__ft=setTimeout(fit,120);});
const KC={'구매 입고':'buy','생산 소모':'use','자가사용':'self','조정':'adj'};
function detail(code,keep){
 const it=D.items.find(x=>x.code===code);if(!it)return;OPEN=code;if(!keep)KF='all';const c=calc(it);
 $('#pt').textContent=it.nm;
 $('#ps').innerHTML='gg'+esc(it.gg)+' · 품목코드 '+esc(it.code)+' · 매입처 '+esc(it.sup||'-');
 const mon=ymd(kst()).slice(0,7);let mi=0,mo=0;for(const l of it.lines)if(l.d.slice(0,7)===mon){mi+=l.i;mo+=l.o;}
 let h='<div class="big3"><div><span>지금 재고</span><b class="num" style="color:'+(c.q<0?'#b91c1c':'#111827')+'">'+kgS(c.q)+'</b></div><div class="in"><span>이번 달 입고</span><b class="num">'+(mi?kgS(mi):'0')+'</b></div><div class="out"><span>이번 달 출고</span><b class="num">'+(mo?kgS(mo):'0')+'</b></div></div>';
 h+='<p class="info">'+[it.spec?'포장 1개 '+fg(it.spec)+'g'+(c.q>0?' (약 '+(Math.round(c.q/it.spec*10)/10)+'개 분량)':''):'',it.empty?'빈 용기 '+fg(it.empty)+'g (실사 때 빼는 무게)':'',c.days!=null?'최근 4주 하루 평균 '+kgS(c.daily)+' 사용':''].filter(Boolean).join(' · ')+'</p>';
 if(c.live&&Math.abs(c.diff)>=1)h+='<div class="warn">※ 아래 내역을 읽은 뒤('+esc(String(D.scrapedAt||D.built).slice(5,16).replace('T',' ').replace('-','/'))+') 이카운트 재고가 '+(c.diff>0?'+':'')+fg(c.diff)+'g 바뀌었습니다. 새 내역은 다음 갱신 때 나타납니다.</div>';
 const kinds=['all','구매 입고','생산 소모','자가사용','조정'];
 h+='<div class="kinds">'+kinds.map(k=>{const n=k==='all'?it.lines.length:it.lines.filter(l=>l.k===k).length;return n||k==='all'?'<button class="chip" data-k="'+k+'" aria-pressed="'+(KF===k)+'">'+(k==='all'?'전체':k)+' '+n+'</button>':'';}).join('')+'</div>';
 const lines=it.lines.filter(l=>KF==='all'||l.k===KF).slice().reverse();
 if(!lines.length)h+='<div class="empty" style="font-size:19px;padding:30px">내역이 없습니다</div>';
 else{h+='<table class="lg"><thead><tr><th>날짜</th><th>구분</th><th>내용</th><th>입고(g)</th><th>출고(g)</th><th>재고(g)</th></tr></thead><tbody>';
  let cm='';const ms={};for(const l of it.lines){const m=l.d.slice(0,7);ms[m]=ms[m]||{i:0,o:0,b:0};ms[m].i+=l.i;ms[m].o+=l.o;ms[m].b=l.b;}
  for(const l of lines){const m=l.d.slice(0,7);if(m!==cm){cm=m;const s=ms[m];h+='<tr class="mh"><td colspan="6">'+(+m.slice(0,4))+'년 '+(+m.slice(5))+'월 · 입고 <span class="num">'+kgS(s.i)+'</span> · 출고 <span class="num">'+kgS(s.o)+'</span> · 월말 재고 <span class="num">'+kgS(s.b)+'</span></td></tr>';}
   const memo=[l.w&&l.w!=='빵을그리다'?l.w:'',l.m].filter(Boolean).join(' · ');
   h+='<tr><td class="num">'+md(l.d)+'</td><td><span class="k '+(KC[l.k]||'etc')+'">'+esc(l.k)+'</span></td><td class="memo">'+esc(memo||'-')+'</td><td class="r num">'+(l.i?'<span class="pin">+'+fg(l.i)+'</span>':'')+'</td><td class="r num">'+(l.o?'<span class="pout">−'+fg(l.o)+'</span>':'')+'</td><td class="r num"><b>'+fg(l.b)+'</b></td></tr>';}
  h+='</tbody></table>';}
 h+='<div class="src">이카운트 재고 I → 출력물 → 재고현황(양식 「'+esc(D.form)+'」)에서 품목을 눌렀을 때 나오는 재고수불부와 같은 내용입니다. 기간 2026/08/01부터, 조정의 마이너스 출고는 입고로 바꿔 보여 줍니다. 이 화면은 보기 전용이며 이카운트에는 아무것도 쓰지 않습니다.</div>';
 $('#pb').innerHTML=h;if(!keep)$('#pb').scrollTop=0;$('#ov').classList.add('show');$('#pn').classList.add('show');$('#pn').setAttribute('aria-hidden','false');}
function closeD(){OPEN=null;$('#ov').classList.remove('show');$('#pn').classList.remove('show');$('#pn').setAttribute('aria-hidden','true');}
document.addEventListener('click',e=>{const t=e.target;
 const cd=t.closest('.card');if(cd){detail(cd.dataset.code);return;}
 const f=t.closest('[data-f]');if(f){FIL=FIL===f.dataset.f?'all':f.dataset.f;render();return;}

 const k=t.closest('[data-k]');if(k){KF=k.dataset.k;detail(OPEN,true);return;}
 if(t.id==='ov'||t.closest('#px'))closeD();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='sortSel'){SORT=e.target.value;try{localStorage.setItem('stock4_sort',SORT);}catch(_){}render();}});
function tick(){const t=kst();$('#ck').textContent=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
 const s1=LVAT?'이카운트 재고 '+LVAT:'';$('#ts1').textContent=s1;
 $('#ts2').textContent=D?'입출고 내역 '+String(D.built).slice(5,16).replace('-','/')+' 기준':'';}
async function loadLive(){try{const r=await fetch(LIVE+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();const m={};for(const x of j.items||[])m[x.code]=x.qty;LV=m;const u=String(j.updatedAt||'');LVAT=u?u.slice(5,7)+'/'+u.slice(8,10)+' '+u.slice(11,16):'';}catch(_){}}
async function loadData(){let fk=DEF_F;try{fk=localStorage.getItem('dash_fkey_v1')||DEF_F;}catch(_){}
 try{const r=await fetch('stock4.enc.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('자료 파일 '+r.status);let e=await r.json(),d;
  try{d=await decrypt(e,fk);}catch(err){if(fk!==DEF_F)d=await decrypt(e,DEF_F);else throw err;}
  D=d;try{localStorage.setItem('stock4_cache',JSON.stringify(D));}catch(_){}}
 catch(err){if(!D){try{D=JSON.parse(localStorage.getItem('stock4_cache')||'null');}catch(_){}}if(!D)$('#grid').innerHTML='<div class="empty">재고 자료를 열지 못했습니다 ('+esc(err.message||err)+')<br>잠시 뒤 다시 확인합니다</div>';}}
async function all(){await Promise.all([loadLive(),loadData()]);render();tick();}
/* 새 판이 올라오면 스스로 새로고침 (상세 창이 열려 있으면 닫힌 뒤) */
async function verCheck(){try{const r=await fetch('stock.html?vc='+Date.now(),{cache:'no-store'});if(!r.ok)return;const b=((await r.text()).match(/name="stock-build" content="([^"]+)"/)||[])[1];if(b&&BUILD&&b!==BUILD&&!OPEN)location.reload();}catch(_){}}
all();setInterval(tick,15000);setInterval(all,5*60e3);setInterval(verCheck,10*60e3);
})();
</script>
</body></html>
