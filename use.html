<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="원료 기록">
<title>원료 사용 기록 · 빵을그리다</title>
<link rel="manifest" href="use.webmanifest">
<link rel="icon" href="dash-icon-192.png">
<link rel="apple-touch-icon" href="dash-icon-192.png">
<style>
:root{
  --bg:#f5f4f2;--card:#fff;--ink:#1c1917;--ink2:#44403c;--sub:#6b625b;--faint:#a8a29e;--line:#e7e5e4;--soft:#faf9f7;
  --brand:#7a4a26;--brand2:#a8642f;--brand-bg:#f6ece3;
  --red:#c0392b;--red-bg:#fdecea;--amber:#a15c07;--amber-bg:#fff4e0;--green:#15803d;--green-bg:#ecf8f0;--blue:#1d4ed8;--blue-bg:#eef3fe;
  --r:16px;--sh:0 1px 2px rgba(28,25,23,.06);--tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px;-webkit-text-size-adjust:100%}
html.f2{font-size:19px}html.f3{font-size:21px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tab-h) + 96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums}
/* 머리 */
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;object-fit:contain;flex:none}
.brand b{font-size:1.08rem;font-weight:800;white-space:nowrap}
.brand span{font-size:.9rem;color:var(--sub);font-weight:600;white-space:nowrap}
.hd .sp{flex:1}
.who{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-weight:700;font-size:.92rem;white-space:nowrap}
.who i{font-style:normal;color:var(--sub);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--sub);white-space:nowrap}
.sync::before{content:"";width:9px;height:9px;border-radius:5px;background:var(--green)}
.sync.wait::before{background:#f59e0b}.sync.off::before{background:var(--red)}
@media (max-width:520px){.brand span,.sync b{display:none}}
/* 위 메뉴 (넓은 화면) / 아래 메뉴 (휴대폰) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.82rem;font-weight:700;color:var(--sub)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand)}
nav.tabs button .bd{font-size:.7rem;background:var(--red);color:#fff;border-radius:999px;padding:0 6px;margin-left:2px}
@media (min-width:900px){
  body{padding-bottom:110px}
  nav.tabs{position:sticky;top:61px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px}
  nav.tabs button{height:48px;flex-direction:row;gap:8px;padding:0 20px;border-radius:12px;font-size:.95rem}
  nav.tabs button.on{background:var(--brand-bg)}
}
main{max-width:1100px;margin:0 auto;padding:14px 14px 0}
.view{display:none}.view.on{display:block}
/* 기록하기 */
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.step.dim{opacity:.45;pointer-events:none}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh .n{width:30px;height:30px;border-radius:15px;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:.95rem}
.sh .n.done{background:var(--green)}
.sh h2{margin:0;font-size:1.12rem;font-weight:800}
.sh .pick{margin-left:auto;font-weight:800;color:var(--brand);font-size:1rem;text-align:right}
.sh .chg{margin-left:8px;font-size:.85rem;color:var(--sub);text-decoration:underline;white-space:nowrap}
.grp{font-size:.82rem;font-weight:800;color:var(--sub);margin:14px 2px 8px;display:flex;align-items:center;gap:8px}
.grp:first-child{margin-top:0}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.items{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.items{grid-template-columns:repeat(4,1fr)}}
.item{min-height:76px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);text-align:left;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative}
.item b{font-size:1.02rem;font-weight:800;line-height:1.25}
.item small{font-size:.8rem;color:var(--sub);line-height:1.3}
.item .dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:4px}
.item.on{border-color:var(--brand);background:var(--brand-bg);box-shadow:0 0 0 2px var(--brand) inset}
.dB{background:#d97706}.dC{background:#2563eb}.dA{background:#b91c1c}.dX{background:#78716c}
.kinds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.kinds{grid-template-columns:repeat(5,1fr)}}
.kind{min-height:72px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:1rem;padding:6px}
.kind span{font-size:1.5rem;line-height:1}
.kind small{font-weight:600;font-size:.75rem;color:var(--sub)}
.kind.on{border-color:var(--brand);background:var(--brand-bg);box-shadow:0 0 0 2px var(--brand) inset}
.kind.wide{grid-column:1/-1}
@media (min-width:640px){.kind.wide{grid-column:auto}}
.fields{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:640px){.fields.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
label.f{min-width:0}
label.f{display:block}
label.f>span{display:block;font-size:.9rem;font-weight:700;color:var(--ink2);margin-bottom:6px}
label.f>span small{font-weight:600;color:var(--sub)}
.inp{display:flex;align-items:center;border:1.5px solid #d6d3d1;border-radius:14px;background:#fff;overflow:hidden}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(122,74,38,.15)}
.inp input{flex:1;min-width:0;width:100%;border:0;outline:0;height:58px;padding:0 14px;font-size:1.45rem;font-weight:800;background:transparent}
.inp em{font-style:normal;color:var(--sub);font-weight:700;padding:0 14px;font-size:1rem}
.inp.sm input{height:50px;font-size:1.1rem;font-weight:600}
.hint{font-size:.85rem;color:var(--sub);margin-top:6px}
.calc{display:flex;align-items:baseline;gap:8px;justify-content:center;background:var(--green-bg);color:var(--green);border-radius:14px;padding:12px;font-weight:800;margin-top:12px}
.calc b{font-size:1.9rem}
.calc.bad{background:var(--red-bg);color:var(--red)}
.calc.zero{background:var(--soft);color:var(--sub)}
.gapbox{margin-top:12px;border-radius:14px;padding:12px 14px;background:var(--amber-bg);border:1px solid #f5d39a;color:#7c4a03;font-size:.92rem}
.gapbox b{color:#7c2d12}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--soft);font-weight:700;font-size:.95rem}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.sm{min-height:38px;padding:0 12px;font-size:.85rem}
.link{color:var(--brand);font-weight:700;text-decoration:underline;font-size:.9rem;padding:6px 0}
.stepper{display:inline-flex;align-items:center;border:1.5px solid #d6d3d1;border-radius:14px;overflow:hidden;background:#fff}
.stepper button{width:54px;height:52px;font-size:1.5rem;font-weight:700;color:var(--ink2)}
.stepper input{width:70px;height:52px;border:0;text-align:center;font-size:1.25rem;font-weight:800;outline:0}
textarea.memo{width:100%;min-height:58px;border:1.5px solid #d6d3d1;border-radius:14px;padding:10px 12px;font-size:1rem;resize:vertical;outline:0}
textarea.memo:focus{border-color:var(--brand)}
.row2{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
/* 저장 막대 */
.savebar{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:35;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 14px;display:none}
.savebar.on{display:block}
@media (min-width:900px){.savebar{bottom:0}}
.savebar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.savebar .sum{flex:1;min-width:0;font-size:.9rem;color:var(--ink2);line-height:1.35}
.savebar .sum b{display:block;font-size:1rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:58px;padding:0 26px;border-radius:14px;font-weight:800;font-size:1.08rem;background:var(--brand);color:#fff;white-space:nowrap}
.btn:disabled{background:#d6d3d1;color:#fff}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.btn.red{background:var(--red)}
.btn.full{width:100%}
/* 목록 */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar h1{font-size:1.15rem;margin:0;font-weight:800}
.bar .sp{flex:1}
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:1.2rem;font-weight:800}
.dnav b{min-width:120px;text-align:center;font-size:1.05rem}
.sumrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.sumrow::-webkit-scrollbar{display:none}
.sumc{flex:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.85rem;color:var(--sub);white-space:nowrap}
.sumc b{display:block;color:var(--ink);font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.rec{display:flex;gap:12px;padding:14px;align-items:flex-start;text-align:left;width:100%;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .tm{font-weight:800;font-size:1rem;width:52px;flex:none;color:var(--ink2)}
.rec .bd{flex:1;min-width:0}
.rec .t1{font-weight:800;font-size:1.02rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rec .t2{font-size:.9rem;color:var(--ink2);margin-top:2px}
.rec .t3{font-size:.8rem;color:var(--sub);margin-top:2px}
.rec .amt{text-align:right;flex:none}
.rec .amt b{display:block;font-size:1.15rem}
.rec .amt span{font-size:.75rem;color:var(--sub)}
.tag{display:inline-flex;align-items:center;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:6px;background:#f1f0ee;color:var(--sub);white-space:nowrap}
.tag.use{background:var(--blue-bg);color:var(--blue)}.tag.open{background:var(--green-bg);color:var(--green)}.tag.in{background:#f3e8ff;color:#7e22ce}.tag.waste{background:var(--red-bg);color:var(--red)}.tag.count{background:var(--amber-bg);color:var(--amber)}
.tag.gap{background:var(--red);color:#fff}
.gaprow{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--red-bg);color:var(--red);font-weight:700;font-size:.9rem;border-top:1px solid #f5c2bd}
.empty{padding:34px 16px;text-align:center;color:var(--sub)}
.big{font-size:2rem;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{font-size:.82rem;color:var(--sub);font-weight:700}
.stat b{display:block;font-size:1.45rem;font-weight:800;margin-top:2px}
.stat.red b{color:var(--red)}.stat.green b{color:var(--green)}
.days{display:flex;align-items:flex-end;gap:6px;height:110px;padding:8px 4px 0}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:0}
.days i{display:block;width:70%;background:var(--brand2);border-radius:5px 5px 0 0;min-height:2px}
.days small{font-size:.7rem;color:var(--sub)}.days b{font-size:.72rem}
/* 설정 */
.set h3{margin:0 0 8px;font-size:1.02rem}
.set .note{font-size:.85rem;color:var(--sub);margin-bottom:10px}
.tare{display:grid;grid-template-columns:1fr 150px;gap:8px 12px;align-items:center}
.tare div{font-weight:700}
/* 시트 (아래에서 올라오는 창) */
.scrim{position:fixed;inset:0;background:rgba(28,25,23,.38);z-index:60;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:none}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:auto;top:8vh;border-radius:20px}}
.sheet h2{margin:0 0 6px;font-size:1.2rem}
.sheet p{margin:0 0 14px;color:var(--sub);font-size:.92rem}
body.modal .scrim,body.modal .sheet{display:block}
.whos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.whos button{height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);font-weight:800;font-size:1.05rem}
.whos button.on{border-color:var(--brand);background:var(--brand-bg)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 110px);transform:translateX(-50%);background:#1c1917;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.lock{max-width:460px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px}
.lock h1{font-size:1.2rem;margin:0 0 8px}
.lock p{color:var(--sub);margin:0 0 12px}
.lock input{width:100%;height:52px;border:1.5px solid #d6d3d1;border-radius:12px;padding:0 12px;margin-bottom:10px}
.done{text-align:center;padding:10px 0 4px}
.done .ck{width:64px;height:64px;border-radius:32px;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:2rem;font-weight:800}
.done .acts{display:grid;gap:10px;margin-top:16px}
</style>
</head>
<body>
<header><div class="hd">
  <div class="brand"><img src="brand_logo.png" alt="빵을그리다"><b>빵을그리다</b><span>원료 사용 기록</span></div>
  <div class="sp"></div>
  <span class="sync" id="sync"><b>확인 중</b></span>
  <button class="who" id="whoBtn"><i>기록자</i> <span id="whoName">선택</span> ▾</button>
</div></header>
<nav class="tabs" id="tabs">
  <button data-tab="rec" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>기록하기</button>
  <button data-tab="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>오늘 기록</button>
  <button data-tab="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>원료별</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</nav>
<main id="main">
  <section class="view on" id="v-rec"></section>
  <section class="view" id="v-day"></section>
  <section class="view" id="v-item"></section>
  <section class="view" id="v-set"></section>
</main>
<div class="savebar" id="savebar"><div class="in"><div class="sum" id="saveSum"></div><button class="btn" id="saveBtn" disabled>저장하기</button></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
/* ════════════════════════════════════════════════════════════
   빵을그리다 원료 사용 기록 v1 (2026-10-20 Aside)
   · 저장: 이 기기에 먼저 저장 → 구글 시트(Apps Script)로 보냄. 인터넷이 끊겨도 기록 가능, 연결되면 자동으로 보냄
   · 열쇠: 링크의 ?k= (처음 한 번). 이 기기에 기억하고 주소에도 남겨 둠
   · 「빈틈」: 지난번 「쓴 뒤 무게」와 이번 「쓰기 전 무게」가 다르면, 그 사이에 기록 안 된 사용이 있었다는 뜻
   ════════════════════════════════════════════════════════════ */
const API='https://script.google.com/macros/s/AKfycbwBPISqC-n-VqmBU9ueUom5kHzwOxlE0VGXoSTN2OmCWjSZaqqK82jizdKJpTAkWn2q/exec';
const SHEET_URL='https://docs.google.com/spreadsheets/d/1RkJG7xf-kGepK4KjJi0nv4G6lrzpiI2LZs2kFf1qenw/edit';
const LS_KEY='use_key_v1',LS_DATA='use_data_v1',LS_UI='use_ui_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW='일월화수목금토';
const fmt=v=>v==null||v===''||isNaN(v)?'—':(Math.round(Number(v)*10)/10).toLocaleString('ko-KR');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const md=s=>{const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';};
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

async function api(body){const r=await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({k:KEY},body))});const j=await r.json();if(!j.ok)throw new Error(j.err||'오류');return j;}
async function pull(){
  if(!KEY)return;
  try{const j=await api({op:'list',since:D.lastPull?D.lastPull-120000:0});
    let ch=0;for(const r of j.recs||[]){const o=D.recs[r.id];if(!o||(r.mt||0)>=(o.mt||0)){if(!D.queue.includes(r.id)){D.recs[r.id]=r;ch++;}}}
    if(j.cfg){for(const k in j.cfg){if(!D.cfgQ[k])D.cfg[k]=j.cfg[k];}}
    D.lastPull=j.now||Date.now();syncErr='';saveD();if(ch||1)render();
  }catch(e){syncErr=navigator.onLine===false?'인터넷 연결 없음':String(e.message||e);}
  paintSync();
}
let flushing=false;
async function flush(){
  if(!KEY||flushing)return;flushing=true;
  try{
    const ids=D.queue.slice(0,40);if(ids.length){const recs=ids.map(id=>D.recs[id]).filter(Boolean);const j=await api({op:'save',recs});const ok=new Set(j.saved||[]);D.queue=D.queue.filter(id=>!ok.has(id));saveD();}
    for(const k of Object.keys(D.cfgQ)){await api({op:'cfg',key:k,value:D.cfg[k]});delete D.cfgQ[k];saveD();}
    syncErr='';
  }catch(e){syncErr=navigator.onLine===false?'인터넷 연결 없음':String(e.message||e);}
  flushing=false;paintSync();if(D.queue.length&&!syncErr)setTimeout(flush,500);
  if(ui.tab!=='rec')render();
}

  else{el.className='sync';el.innerHTML='<b>저장됨</b>';}

/* ── 원료별 흐름: 통 무게 이어 보기 + 빈틈 ── */
function chain(key){
  const rs=Object.values(D.recs).filter(r=>!r.del&&ikey(r)===key).sort((a,b)=>(a.at||0)-(b.at||0));
  let last=null,lastRec=null;const out=[];
  for(const r of rs){
    let gap=null;const tol=w=>Math.max(5,Math.abs(w||0)*0.003);
    if(r.kind==='open'){last=num(r.after);lastRec=r;out.push({r,gap});continue;}
    if(r.kind==='in'){out.push({r,gap});continue;}
    const b=num(r.before),a=num(r.after),u=num(r.used);
    const start=r.kind==='count'?a:b;
    if(last!=null&&start!=null&&Math.abs(last-start)>tol(last))gap={g:Math.round((last-start)*10)/10,from:lastRec};
    if(a!=null)last=a;else if(u!=null&&last!=null)last=Math.round((last-u)*10)/10;
    lastRec=r;out.push({r,gap});
  }
  return {list:out,last,lastRec};
}
const num=v=>v===null||v===undefined||v===''||isNaN(Number(v))?null:Number(v);

function inAmount(){const c=num(F.cnt),it=itemBy(F.code,F.name);if(c!=null&&it&&it.pack)return c*it.pack;return num(F.used);}

  if(ds.dnav){const n=addD(ui.day,Number(ds.dnav));if(n>today())return;ui.day=n;renderDay();return;}
  if(ds.rec){openRec(ds.rec);return;}
  if(ds.pickitem){ui.item=ds.pickitem;saveUi();renderItem();return;}
  if(ds.setwho){ui.who=ds.setwho;saveUi();render();toast(ui.who+' 님으로 기록해요');return;}
  if(ds.whopick){ui.who=ds.whopick;saveUi();const then=window.__whoThen;closeSheet();render();if(then)then();return;}
  if(ds.font){ui.font=Number(ds.font);saveUi();document.documentElement.classList.toggle('f2',ui.font===2);document.documentElement.classList.toggle('f3',ui.font===3);renderSet();return;}
  const a=ds.act;if(!a)return;
  if(sheetAct&&document.body.classList.contains('modal')&&t.closest('#sheet')){sheetAct(a);return;}
  if(a==='reitem'){newForm();renderRec();window.scrollTo(0,0);return;}
  if(a==='direct1'){F.direct=true;F.used=calcUsed()!=null?String(calcUsed()):'';renderRec();const u=$('#usedIn');if(u)u.focus();return;}
  if(a==='direct0'){F.direct=false;renderRec();return;}
  if(a==='gorec'){go('rec');return;}
  if(a==='sync'){toast('확인하는 중…');flush().then(pull).then(()=>{renderSet();toast(syncErr?'연결 오류: '+syncErr:'최신으로 맞췄어요');});return;}
  if(a==='addwho'){const n=($('#newWho').value||'').trim();if(!n)return;if(!workers().includes(n))setCfg('workers',workers().concat([n]));renderSet();return;}
  if(a==='additem'){sheet('<h2>원료 추가</h2><p>목록에 없는 원료를 추가해요. 모든 기기에 같이 보여요.</p><label class="f"><span>원료 이름</span><div class="inp sm"><input id="niName" placeholder="예) 버터(이즈니)"></div></label><label class="f" style="margin-top:10px"><span>포장 1개 <small>(예: 500g 봉)</small></span><div class="inp sm"><input id="niPack" placeholder="예) 500g 봉"></div></label><label class="f" style="margin-top:10px"><span>포장 1개 무게 g <small>(알면)</small></span><div class="inp sm"><input id="niG" inputmode="decimal" placeholder="500"></div></label><div style="display:grid;gap:10px;margin-top:14px"><button class="btn full" data-act="niok">추가하기</button><button class="btn ghost full" data-act="close">닫기</button></div>');
    sheetAct=x=>{if(x==='close'){closeSheet();return;}const n=($('#niName').value||'').trim();if(!n){toast('이름을 넣어 주세요');return;}const list=(D.cfg.items||[]).concat([{g:'X',code:'',name:n,packL:($('#niPack').value||'').trim(),pack:Number($('#niG').value)||0,where:['테스트·연구개발']}]);setCfg('items',list);closeSheet();pickItem('',n);};return;}
});
document.getElementById('saveBtn').onclick=saveForm;
document.getElementById('whoBtn').onclick=()=>askWho();
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-setwho]');if(!t)return;e.preventDefault();const n=t.dataset.setwho;if(confirm(n+' 님을 목록에서 지울까요?')){setCfg('workers',workers().filter(w=>w!==n));if(ui.who===n){ui.who='';saveUi();}renderSet();}});
window.addEventListener('online',()=>{flush();pull();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){flush();pull();}});
setInterval(()=>{if(document.visibilityState==='visible'){flush();if(ui.tab!=='rec'||!F.kind)pull();}},30000);
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch(_){}}
render();
if(KEY){flush().then(pull);if(!ui.who)setTimeout(()=>askWho(),400);}
})();
</script>
</body>
</html>
