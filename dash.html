<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<title>빵을그리다 업무 대시보드</title>
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#111827; --ink2:#374151; --sub:#6b7280; --faint:#9ca3af; --line:#e5e7eb; --soft:#f9fafb;
  --brand:#d9622b;
  --red:#dc2626; --red-bg:#fef2f2; --amber:#b45309; --amber-bg:#fffbeb; --green:#15803d; --green-bg:#f0fdf4; --blue:#1d4ed8; --blue-bg:#eff6ff; --gray-bg:#f3f4f6;
  --r:14px; --sh:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
@media (min-width:1100px){html{font-size:17px}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;letter-spacing:-.005em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* 상단 */
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.hd{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:44px;height:44px;object-fit:contain;flex:none}
.brand .nm{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand .dv{width:1px;height:22px;background:var(--line)}
.brand .tt{font-size:.95rem;color:var(--sub);font-weight:600;white-space:nowrap}
.hd .sp{flex:1}
.now{text-align:right;line-height:1.25}
.now .t{font-size:1.45rem;font-weight:700}
.now .d{font-size:.8rem;color:var(--sub)}
.tools{display:flex;gap:6px}
.ib{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--ink2)}
.ib svg{width:18px;height:18px}
.ib:active{background:var(--soft)}
@media (max-width:760px){.brand .dv,.brand .tt,.ib span{display:none}.hd{padding:10px 14px}}

main{max-width:1400px;margin:0 auto;padding:20px 24px 28px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.bar h1{margin:0;font-size:1.05rem;font-weight:700}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.fresh i{width:8px;height:8px;border-radius:4px;background:var(--green)}
.fresh.stale i{background:#f59e0b}
.fresh.err i{background:var(--red)}
.bar .sp{flex:1}
.bar .hint{font-size:.8rem;color:var(--faint)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.kpis .kpi{grid-column:span 3}.kpis .kpi.w4{grid-column:span 4}
.grp{grid-column:1/-1;font-size:.8rem;font-weight:800;color:var(--sub);letter-spacing:.02em;margin:2px 0 -4px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
@media (max-width:980px){.kpis .kpi,.kpis .kpi.w4{grid-column:span 6}.kpi{min-height:180px}}
@media (max-width:560px){.kpis .kpi,.kpis .kpi.w4{grid-column:span 12}}
.kpi{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px 18px;display:flex;flex-direction:column;min-height:max(180px,calc((100vh - 290px) / 2));transition:border-color .15s,box-shadow .15s}
.kpi:hover{border-color:#cbd5e1;box-shadow:0 4px 14px rgba(16,24,40,.07)}
.kpi:active{transform:translateY(1px)}
.kpi .top{display:flex;align-items:center;gap:10px}
.kpi .ic{width:36px;height:36px;border-radius:10px;background:var(--gray-bg);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.kpi .ic svg{width:20px;height:20px}
.lg{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.lg img,.lg svg{width:28px;height:28px;border-radius:6px;object-fit:contain;display:block}
.lg.app{border:0;background:none;overflow:hidden}
.lg.app img,.lg.app svg{width:44px;height:44px;border-radius:12px}
.duo{display:flex;gap:6px;flex:none}
.ph .lg{width:38px;height:38px;border-radius:10px}.ph .lg img,.ph .lg svg{width:24px;height:24px}
.ph .lg.app img,.ph .lg.app svg{width:38px;height:38px;border-radius:10px}
.kpi .lb{font-size:1rem;font-weight:700;color:var(--ink2)}
.kpi .src{margin-left:auto;font-size:.75rem;color:var(--faint);white-space:nowrap}
.kpi .val{margin:auto 0;padding:14px 0 6px;display:flex;align-items:baseline;gap:8px}
.kpi .val b{font-size:clamp(2.8rem,10vh,5.2rem);font-weight:700;line-height:1;letter-spacing:-.03em}
.kpi .val span{font-size:clamp(1rem,2.4vh,1.25rem);color:var(--sub);font-weight:600}
.kpi .val .dl{margin-left:8px;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gray-bg);color:var(--sub)}
.kpi .val .dl.up{background:var(--red-bg);color:var(--red)} .kpi .val .dl.down{background:var(--green-bg);color:var(--green)}
.kpi .ft{padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--sub)}
.kpi .ft{min-width:0}.kpi .ft>span:not(.badge):not(.go){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kpi .ft .go{white-space:nowrap;flex:none;margin-left:auto;display:flex;align-items:center;gap:2px;font-weight:600;color:var(--faint);font-size:.8rem}
.kpi .ft .go svg{width:16px;height:16px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:4px;background:currentColor}
.b-red{background:var(--red-bg);color:var(--red)} .b-amber{background:var(--amber-bg);color:var(--amber)} .b-green{background:var(--green-bg);color:var(--green)} .b-blue{background:var(--blue-bg);color:var(--blue)} .b-gray{background:var(--gray-bg);color:var(--sub)}
.kpi.alert{border-color:#fecaca} .kpi.alert .ic{background:var(--red-bg);color:var(--red)}
.kpi.warn .ic{background:var(--amber-bg);color:var(--amber)}
.kpi.ok .ic{background:var(--green-bg);color:var(--green)}
.kpi.info .ic{background:var(--blue-bg);color:var(--blue)}
.foot{margin-top:18px;text-align:center;font-size:.78rem;color:var(--faint)}

/* 상세 패널 */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:31;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(16,24,40,.12)}
body.open .scrim{opacity:1;pointer-events:auto} body.open .panel{transform:none}
.ph{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.ph .back{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.ph .back svg{width:20px;height:20px}
.ph h2{margin:0;font-size:1.1rem;font-weight:800}
.ph .s{font-size:.8rem;color:var(--sub)}
.pb{flex:1;overflow:auto;padding:16px 18px 30px;-webkit-overflow-scrolling:touch}
.hist{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hist button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.82rem;font-weight:600;color:var(--ink2);white-space:nowrap}
.hist button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.box h3{margin:0 0 10px;font-size:.92rem;font-weight:800;display:flex;align-items:center;gap:8px}
.box h3 .c{font-size:.8rem;font-weight:700;color:var(--sub)}
.meta{font-size:.82rem;color:var(--sub);margin:-2px 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-weight:700}
.stat span{font-size:.75rem;color:var(--sub)}
.rows{display:flex;flex-direction:column}
.row{padding:12px 2px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.row:first-child{border-top:0;padding-top:2px}
.row .mk{width:4px;align-self:stretch;border-radius:2px;background:var(--line);flex:none}
.row .mk.red{background:var(--red)} .row .mk.amber{background:#f59e0b} .row .mk.blue{background:var(--blue)} .row .mk.green{background:var(--green)}
.row .bd{flex:1;min-width:0}
.row .t1{font-weight:700;font-size:.95rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .t2{font-size:.88rem;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.row .t2 b{color:var(--ink)}
.row ul{margin:4px 0 0;padding-left:18px;font-size:.86rem;color:var(--ink2)}
.row .due{margin-top:4px;font-size:.85rem;font-weight:700;color:var(--red)}
.row .rt{text-align:right;flex:none}
.row .rt b{display:block;font-size:1.05rem}
.row .rt span{font-size:.75rem;color:var(--sub)}
.tag{display:inline-flex;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--gray-bg);color:var(--sub);white-space:nowrap}
.tag.red{background:var(--red-bg);color:var(--red)} .tag.amber{background:var(--amber-bg);color:var(--amber)} .tag.blue{background:var(--blue-bg);color:var(--blue)} .tag.green{background:var(--green-bg);color:var(--green)}
.note{padding:12px 14px;border-radius:10px;font-size:.9rem;font-weight:600}
.note.ok{background:var(--green-bg);color:var(--green)} .note.red{background:var(--red-bg);color:var(--red)} .note.gray{background:var(--gray-bg);color:var(--sub);font-weight:500;text-align:center;padding:22px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.days button{padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);text-align:center;line-height:1.25}
.days b{display:block;font-size:.9rem}
.days span{font-size:.72rem;color:var(--sub)}
.days button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.days button.on span{color:#d1d5db}
.days button.z{opacity:.55}
.link{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;height:46px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:.92rem}
.sched .row{align-items:center}
.sched .tm{font-weight:800;width:52px;flex:none}

/* 잠금 */
.lock{max-width:440px;margin:56px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.lock h1{font-size:1.2rem;margin:0 0 8px}
.lock p{color:var(--sub);font-size:.9rem;margin:0}
.lock input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;margin:16px 0 10px;background:var(--card);color:var(--ink)}
.lock button{width:100%;height:46px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700}
.err{color:var(--red);font-size:.86rem;margin-top:10px}

/* 전광판·밤 화면 */
body.board .tools .hide-b{display:none}
body.night{--bg:#0b0f17;--card:#121826;--ink:#f3f4f6;--ink2:#d1d5db;--sub:#9ca3af;--faint:#6b7280;--line:#1f2937;--soft:#161d2b;--gray-bg:#1f2937;--red-bg:#3b1515;--amber-bg:#36270b;--green-bg:#0f2a1a;--blue-bg:#14213d;--red:#f87171;--amber:#fbbf24;--green:#4ade80;--blue:#93c5fd}
body.night .hist button.on,body.night .days button.on{background:#f3f4f6;color:#111827;border-color:#f3f4f6}
body.night .days button.on span{color:#4b5563}
body.night .link,body.night .lock button{background:#f3f4f6;color:#111827}
body.night .kpi.alert{border-color:#7f1d1d}
</style>
</head>
<body>
<header><div class="hd">
  <div class="brand"><img src="brand_logo.png" alt="빵을그리다 로고"><span class="nm">빵을그리다</span><span class="dv"></span><span class="tt">업무 대시보드</span></div>
  <div class="sp"></div>
  <div class="now"><div class="t num" id="ct"></div><div class="d" id="cd"></div></div>
  <div class="tools">
    <button class="ib" id="bRef" title="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg><span>새로고침</span></button>
    <button class="ib" id="bNight" title="밤 화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="tNight">밤 화면</span></button>
    <button class="ib" id="bBoard" title="전광판"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="tBoard">전광판</span></button>
  </div>
</div></header>
<main id="main"></main>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="ph"><button class="back" id="pClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><span id="pL"></span><div><h2 id="pT"></h2><div class="s" id="pS"></div></div></div>
  <div class="pb" id="pB"></div>
</aside>
<script>
(function(){
'use strict';
const LS_KEY='dash_key_v1',LS_DATA='dash_cache_v1',LS_UI='dash_ui_v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/&lt;(\/?)b&gt;/g,'<$1b>');
const DOW='일월화수목금토';
let ui={night:false,sel:{},day:0};try{Object.assign(ui,JSON.parse(localStorage.getItem(LS_UI)||'{}'));}catch(_){}
const saveUi=()=>{try{localStorage.setItem(LS_UI,JSON.stringify(ui));}catch(_){}};
let D=null,loadErr='',lastLoad=0,openKind=null;

function pickKey(s){s=String(s||'');try{s=decodeURIComponent(s);}catch(_){}const m=s.match(/(?:^|[#?&\s])k=([A-Za-z0-9_-]{16,})/);if(m)return m[1];const t=s.trim();return /^[A-Za-z0-9_-]{16,}$/.test(t)?t:'';}
const k0=pickKey(location.hash)||pickKey(location.search);
if(k0){try{localStorage.setItem(LS_KEY,k0);}catch(_){}window.__MEMKEY=k0;}
// 주소에 열쇠를 항상 남겨 둔다 → 이 주소를 즐겨찾기/홈 화면에 추가하면 어느 브라우저에서든 바로 열림
function keepKeyInUrl(k){try{if(k&&pickKey(location.search)!==k)history.replaceState(null,'',location.pathname+'?k='+k);}catch(_){}}
try{keepKeyInUrl(k0||localStorage.getItem(LS_KEY));}catch(_){}

function kst(d){const x=d?new Date(d):new Date();return new Date(x.getTime()+(x.getTimezoneOffset()+540)*60000);}
function md(d){const k=kst(d);return (k.getMonth()+1)+'/'+k.getDate()+'('+DOW[k.getDay()]+')';}
function hm(d){const k=kst(d);return String(k.getHours()).padStart(2,'0')+':'+String(k.getMinutes()).padStart(2,'0');}
function sameDay(a,b){const x=kst(a),y=kst(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();}
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return '방금';if(m<60)return m+'분 전';const h=Math.floor(m/60);return h<24?h+'시간 전':Math.floor(h/24)+'일 전';}
function tick(){const k=kst();$('#ct').textContent=hm();$('#cd').textContent=(k.getMonth()+1)+'월 '+k.getDate()+'일 '+DOW[k.getDay()]+'요일';const f=$('#fresh');if(f&&D)f.lastChild.textContent=' 자료 '+D.built.slice(5).replace('-','/')+' · '+ago(lastLoad)+' 확인';}

async function decrypt(e,pw){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const enc=new TextEncoder();const it=+((e.kdf||'').match(/(\d+)$/)||[0,100000])[1];
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.salt),iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},key,b(e.ct))));}

async function load(){
  if(window.__DASH_TEST){D=window.__DASH_TEST;lastLoad=Date.now();render();return;}
  let k=null;try{k=localStorage.getItem(LS_KEY);}catch(_){}k=k||window.__MEMKEY;
  if(!k){renderLock();return;}
  if(!(window.crypto&&crypto.subtle)){renderLock('이 브라우저에서는 열 수 없어요. 크롬(Chrome)에서 열어 주세요.');return;}
  try{const r=await fetch('dash.enc.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('자료 파일 오류 ('+r.status+')');
    D=await decrypt(await r.json(),k);lastLoad=Date.now();loadErr='';try{localStorage.setItem(LS_DATA,JSON.stringify({at:lastLoad,d:D}));}catch(_){}}
  catch(err){
    if(err&&err.name==='OperationError'){try{localStorage.removeItem(LS_KEY);}catch(_){}window.__MEMKEY=null;renderLock('열쇠가 맞지 않아요. 링크 전체(k= 뒤까지)를 다시 붙여넣어 주세요.');return;}
    loadErr=navigator.onLine===false?'인터넷 연결이 끊겨 있어요':String(err&&err.message||err);
    if(!D){try{const c=JSON.parse(localStorage.getItem(LS_DATA)||'null');if(c){D=c.d;lastLoad=c.at;}}catch(_){}}
    if(!D){renderLock('자료를 불러오지 못했어요: '+loadErr);return;}}
  render();
}
function renderLock(msg){
  $('#main').innerHTML='<div class="lock"><h1>업무 대시보드</h1><p>이 기기에서 처음 열었어요. 카카오톡 「나와의 채팅」으로 받은 대시보드 링크를 한 번 눌러 주세요. 다음부터는 바로 열려요.</p>'+
  '<input id="kin" placeholder="또는 받은 링크 전체를 붙여넣기" autocomplete="off"><button id="kbtn">열기</button>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+'</div>';
  $('#kbtn').onclick=()=>{const k=pickKey($('#kin').value);if(!k){renderLock('붙여넣은 내용에서 열쇠를 찾지 못했어요. 링크 전체를 붙여넣어 주세요.');return;}
    try{localStorage.setItem(LS_KEY,k);}catch(_){}window.__MEMKEY=k;keepKeyInUrl(k);$('#kbtn').textContent='여는 중…';$('#kbtn').disabled=true;load();};
}

// ---------- 자료 도우미 ----------
const latest=a=>(a&&a[0])||null;
function selOf(kind){const a=(D&&D[kind])||[];const i=Math.min(ui.sel[kind]||0,Math.max(a.length-1,0));return a[i]||null;}

function slot(s){const now=kst(),nh=now.getHours()+now.getMinutes()/60;
  const hit=(D[s.kind]||[]).find(x=>{if(!sameDay(x.at,Date.now()))return false;const k=kst(x.at),h=k.getHours()+k.getMinutes()/60;return h>=s.h-0.2&&h<s.h+2.5;});
  if(hit)return {st:'done',txt:'완료 '+hm(hit.at)};if(nh<s.h)return {st:'wait',txt:'예정'};if(nh<s.h+1)return {st:'wait',txt:'진행 중'};
  return {st:(D[s.kind]||[]).some(x=>!sameDay(x.at,Date.now()))?'miss':'none',txt:'기록 없음'};}

function kpis(){

  // 3 출고

  // 4 네이버
  out.push(!n?{k:'naver',logo:'naver',ic:'inbox',lb:'네이버 메일',v:'–',u:'',cls:'',badge:['gray','기록 대기'],ft:'07:00 · 22:00 확인'}:
    {k:'naver',logo:'naver',ic:'inbox',lb:'네이버 메일',src:whenShort(n),v:n.total||0,u:'건',cls:na?'alert':'',badge:na?['red','확인 필요 '+na]:['green','확인 필요 없음'],ft:'참고 '+((n.ref||[]).length)+' · 광고 '+((n.ad&&n.ad.count)||0)});
  // 5 UTCA
  out.push(!u?{k:'utca',logo:'gmail',ic:'brief',lb:'UTCA 메일',v:'–',u:'',cls:'',badge:['gray','기록 대기'],ft:'07:00 · 21:00 확인'}:
    {k:'utca',logo:'gmail',ic:'brief',lb:'UTCA 메일',src:whenShort(u),v:(u.stats&&u.stats.total)||0,u:'건',cls:ua?'alert':'',badge:ua?['red','확인 필요 '+ua]:['green','확인 필요 없음'],ft:u.empty?'새 메일 없음':'안 읽음 '+((u.stats&&u.stats.unread)||0)});

  return {s:esc(u.when||'')+' · '+esc(u.range||''),h};}
function pSched(){
  let h='<div class="box sched"><h3>오늘 알림 일정</h3><div class="rows">'+SLOTS.map(s=>{const r=slot(s);const c=r.st==='done'?'green':r.st==='miss'?'red':'';return '<div class="row"><span class="tm num">'+s.t+'</span><div class="bd"><div class="t1">'+s.nm+'</div></div><span class="tag '+c+'">'+r.txt+'</span></div>';}).join('')+'</div></div>';
  if(D.play)h+='<div class="box"><h3>구글 플레이 개발자 계정</h3><div class="t1" style="font-weight:700">'+esc(D.play.status)+'</div><div class="t2" style="font-size:.88rem;color:var(--sub);margin-top:4px">'+esc(D.play.detail||'')+(D.play.at?' · '+md(D.play.at)+' '+hm(D.play.at)+' 확인':'')+'</div></div>';
  h+='<div class="meta">알림이 끝날 때마다 이 화면 자료도 함께 갱신돼요. 「기록 없음」이 계속되면 Aside에 알려 주세요.</div>';
  return {s:'카톡 알림과 같은 시각에 자동으로 확인해요',h};}
function pKhaccp(){const k=selOf('khaccp');if(!k)return {s:'',h:empty('K-HACCP 점검 기록이 없어요.<br>첫 자동 점검 후 보여요.')};
  const c=k.counts||{};let h=hist('khaccp');
  h+='<div class="box"><div class="stats">'+stat('이탈',c.deviation||0)+stat('미작성',c.unwritten||0)+stat('미결재',c.unapproved||0)+'</div></div>';
  const sec=(title,tag,mk,arr,fn,okTxt)=>'<div class="box"><h3><span class="tag '+tag+'">'+title+'</span> <span class="c">'+(arr||[]).length+'건</span></h3>'+((arr||[]).length?'<div class="rows">'+arr.map(x=>'<div class="row"><span class="mk '+mk+'"></span><div class="bd"><div class="t1">'+(x.date?'<span class="tag">'+esc(x.date)+'</span>':'')+esc(x.title||'')+'</div>'+fn(x)+'</div></div>').join('')+'</div>':'<div class="note ok">'+okTxt+'</div>')+'</div>';
  h+=sec('이탈','red','red',k.deviation,x=>'<div class="t2">'+rich(x.item||'')+'</div>'+(x.action?'<div class="t2" style="color:var(--sub)">'+esc(x.action)+'</div>':''),'한계기준 이탈 없음');
  h+=sec('미작성','amber','amber',k.unwritten,x=>x.note?'<div class="t2">'+esc(x.note)+'</div>':'','빠진 일지 없음');
  h+=sec('미결재','blue','blue',k.unapproved,x=>'<div class="t2">'+esc([x.writer?'작성 '+x.writer:'',x.step||'승인 대기'].filter(Boolean).join(' · '))+'</div>','결재 대기 없음');
  if(k.note)h+='<div class="meta">'+rich(k.note)+'</div>';
  h+='<a class="link" href="https://www.k-haccp.co.kr/" target="_blank" rel="noopener">K-HACCP 열기</a>';
  return {s:esc(k.label||'')+(k.range?' · 점검 범위 '+esc(k.range):''),h};}
const PANELS={khaccp:['K-HACCP 일지 점검',pKhaccp,'haccp'],mail:['확인할 메일',pMail,['naver','gmail']],audit:['이카운트 입력값 점검',pAudit,'ecount'],delivery:['출고 · 배송',pDelivery,'dongseon'],naver:['네이버 메일 중요 전달사항',pNaver,'naver'],utca:['UTCA 메일 브리핑',pUtca,'gmail'],sched:['오늘 자동 알림 (카카오톡)',pSched,'kakao']};
function fillPanel(k){const p=PANELS[k];if(!p)return;const r=p[1]();$('#pT').textContent=p[0];$('#pL').innerHTML=logoHtml(p[2]);$('#pS').innerHTML=r.s||'';const pb=$('#pB'),st=pb.scrollTop;pb.innerHTML=r.h;pb.scrollTop=st;}
function openPanel(k){openKind=k;fillPanel(k);$('#pB').scrollTop=0;document.body.classList.add('open');$('#panel').setAttribute('aria-hidden','false');try{history.pushState({p:k},'');}catch(_){}}
function closePanel(fromPop){if(!openKind)return;openKind=null;document.body.classList.remove('open');$('#panel').setAttribute('aria-hidden','true');if(!fromPop){try{history.back();}catch(_){}}}
window.addEventListener('popstate',()=>closePanel(true));
$('#scrim').onclick=()=>closePanel();$('#pClose').onclick=()=>closePanel();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
document.addEventListener('click',e=>{const t=e.target.closest('[data-open],[data-hist],[data-day]');if(!t)return;
  if(t.hasAttribute('data-open')){openPanel(t.dataset.open);return;}
  if(t.hasAttribute('data-hist'))ui.sel[t.dataset.hist]=+t.dataset.i;
  if(t.hasAttribute('data-day'))ui.day=+t.dataset.day;
  saveUi();if(openKind)fillPanel(openKind);});

$('#bRef').onclick=()=>{const f=$('#fresh');if(f)f.lastChild.textContent=' 확인 중…';load();};
function applyNight(){document.body.classList.toggle('night',!!ui.night);$('#tNight').textContent=ui.night?'낮 화면':'밤 화면';document.querySelector('meta[name=theme-color]').content=ui.night?'#121826':'#ffffff';}
$('#bNight').onclick=()=>{ui.night=!ui.night;saveUi();applyNight();};
let wake=null;
$('#bBoard').onclick=async()=>{const on=!document.body.classList.contains('board');document.body.classList.toggle('board',on);$('#tBoard').textContent=on?'전광판 끄기':'전광판';
  if(on){try{await document.documentElement.requestFullscreen();}catch(_){}try{wake=await navigator.wakeLock.request('screen');}catch(_){}}
  else{try{if(document.fullscreenElement)await document.exitFullscreen();}catch(_){}try{wake&&wake.release();}catch(_){}wake=null;}};
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'){if(document.body.classList.contains('board')&&!wake){try{wake=await navigator.wakeLock.request('screen');}catch(_){}}if(Date.now()-lastLoad>120000)load();}});
applyNight();
try{const c0=JSON.parse(localStorage.getItem(LS_DATA)||'null');if(c0&&(localStorage.getItem(LS_KEY))){D=c0.d;lastLoad=c0.at;render();}}catch(_){}
tick();setInterval(tick,15000);
load();setInterval(load,5*60000);
})();
</script>
